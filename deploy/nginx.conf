server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Set only the exact TLS ingress address; never trust all client networks.
    set_real_ip_from ${TRUSTED_EDGE_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/auth/ {
        proxy_pass http://auth:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        # Callback query strings contain credentials. Do not record them.
        access_log off;
    }
    location /api/public/ {
        proxy_pass http://keepnode:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
    }
    location /api/v1/ {
        proxy_pass http://keepnode:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
