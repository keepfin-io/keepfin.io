x-db-admin: &db-admin
  PGHOST: postgres
  PGPORT: 5432
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  PGDATABASE: keepnode

services:
  db-roles:
    image: postgres:18.6
    environment:
      <<: *db-admin
      KEEPFIN_DB_PASSWORD: ${KEEPFIN_DB_PASSWORD:?Set KEEPFIN_DB_PASSWORD}
      KEEPFIN_MIGRATION_DB_PASSWORD: ${KEEPFIN_MIGRATION_DB_PASSWORD:?Set KEEPFIN_MIGRATION_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
      AUTH_MIGRATION_DB_PASSWORD: ${AUTH_MIGRATION_DB_PASSWORD:?Set AUTH_MIGRATION_DB_PASSWORD}
    volumes:
      - ./deploy/postgres:/security:ro
    command: sh /security/roles.sh
    depends_on:
      postgres:
        condition: service_healthy

  keepnode-migrate:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: keepfin_migrator
      DB_PASSWORD: ${KEEPFIN_MIGRATION_DB_PASSWORD:?Set KEEPFIN_MIGRATION_DB_PASSWORD}
      DB_NAME: keepnode
      DB_SSL_MODE: disable
    command: ./keepnode migrate
    depends_on:
      db-roles:
        condition: service_completed_successfully

  auth-migrate:
    build: ./auth
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      DATABASE_URL: postgres://auth_migrator@postgres:5432/keepnode
      PGPASSWORD: ${AUTH_MIGRATION_DB_PASSWORD:?Set AUTH_MIGRATION_DB_PASSWORD}
      AUTH_MAIL_MODE: disabled
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random auth secret}
    command: npm run migrate
    depends_on:
      db-roles:
        condition: service_completed_successfully

  db-security:
    image: postgres:18.6
    environment: *db-admin
    volumes:
      - ./deploy/postgres:/security:ro
    command: psql -X --no-password -f /security/permissions.sql
    depends_on:
      keepnode-migrate:
        condition: service_completed_successfully
      auth-migrate:
        condition: service_completed_successfully

  keepnode:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: keepfin_runtime
      DB_PASSWORD: ${KEEPFIN_DB_PASSWORD:?Set KEEPFIN_DB_PASSWORD}
      DB_NAME: keepnode
      DB_SSL_MODE: disable
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      AUTH_SERVICE_URL: http://auth:3001
      TRUSTED_PROXY_CIDRS: 172.30.80.10/32
      API_IP_RATE_LIMIT: ${API_IP_RATE_LIMIT:-600}
      API_USER_RATE_LIMIT: ${API_USER_RATE_LIMIT:-300}
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-eodhd}
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set a random search API key}
    networks:
      default:
        ipv4_address: 172.30.80.11
    depends_on:
      db-security:
        condition: service_completed_successfully
      auth:
        condition: service_started
      typesense:
        condition: service_started
    restart: unless-stopped

  auth:
    build: ./auth
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      DATABASE_URL: postgres://auth_runtime@postgres:5432/keepnode
      PGPASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
      AUTH_TRUSTED_PROXY_CIDRS: 172.30.80.10/32,172.30.80.11/32
      AUTH_SESSION_RATE_LIMIT: ${AUTH_SESSION_RATE_LIMIT:-900}
      AUTH_MAIL_MODE: disabled
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random auth secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db-security:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      TRUSTED_EDGE_PROXY_CIDR: ${TRUSTED_EDGE_PROXY_CIDR:?Set the exact TLS proxy address or CIDR}
    ports:
      - "127.0.0.1:8080:80"
    networks:
      default:
        ipv4_address: 172.30.80.10
    depends_on:
      - auth
      - keepnode
    restart: unless-stopped

  typesense:
    image: typesense/typesense:30.2
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set a random search API key}
    command: --data-dir /data
    volumes:
      - typesense_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: keepnode
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keepnode"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.80.0/24

volumes:
  postgres_data:
  typesense_data:
