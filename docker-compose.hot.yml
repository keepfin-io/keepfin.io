services:
  keepnode:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: keepnode
      DB_SSL_MODE: disable
      APP_ORIGIN: http://localhost:8080
      AUTH_SERVICE_URL: http://auth:3001
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-eodhd}
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Run make search-init}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
      typesense:
        condition: service_started
    restart: unless-stopped

  auth:
    build: ./auth
    env_file: .env.auth.local
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/keepnode
      AUTH_MAIL_MODE: file
      AUTH_INTERNAL_TESTING: "true"
      AUTH_MAIL_DIRECTORY: /app/.mail
    volumes:
      - ./auth/src:/app/src:ro
      - ./.auth-mail:/app/.mail
    command: sh -c "npm run migrate && node --watch src/server.js"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  vue:
    image: node:26-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTH_PROXY_TARGET: http://auth:3001
      API_PROXY_TARGET: http://keepnode:3000
    volumes:
      - ./web:/app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 8080"
    depends_on:
      - auth
      - keepnode
    restart: unless-stopped

  typesense:
    image: typesense/typesense:30.2
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Run make search-init}
    command: --data-dir /data
    volumes:
      - typesense_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keepnode
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keepnode"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  typesense_data:
