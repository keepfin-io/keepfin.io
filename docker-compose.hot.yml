x-db-admin: &db-admin
  PGHOST: postgres
  PGPORT: 5432
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: keepnode

services:
  db-roles:
    image: postgres:18.6
    environment:
      <<: *db-admin
      KEEPFIN_DB_PASSWORD: keepfin-dev-runtime
      KEEPFIN_MIGRATION_DB_PASSWORD: keepfin-dev-migrator
      AUTH_DB_PASSWORD: auth-dev-runtime
      AUTH_MIGRATION_DB_PASSWORD: auth-dev-migrator
    volumes:
      - ./deploy/postgres:/security:ro
    command: sh /security/roles.sh
    depends_on:
      postgres:
        condition: service_healthy

  keepnode-migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: keepfin_migrator
      DB_PASSWORD: keepfin-dev-migrator
      DB_NAME: keepnode
      DB_SSL_MODE: disable
    command: go run . migrate
    depends_on:
      db-roles:
        condition: service_completed_successfully
    volumes:
      - .:/app

  auth-migrate:
    build:
      context: ./auth
      target: development
    env_file: .env.auth.local
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://auth_migrator@postgres:5432/keepnode
      PGPASSWORD: auth-dev-migrator
      AUTH_MAIL_MODE: disabled
    command: npm run migrate:dev
    depends_on:
      db-roles:
        condition: service_completed_successfully
    volumes:
      - ./auth/src:/app/src:ro

  db-security:
    image: postgres:18.6
    environment: *db-admin
    volumes:
      - ./deploy/postgres:/security:ro
    command: psql -X --no-password -f /security/permissions.sql
    depends_on:
      keepnode-migrate:
        condition: service_completed_successfully
      auth-migrate:
        condition: service_completed_successfully

  auth-seed:
    build:
      context: ./auth
      target: development
    env_file: .env.auth.local
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/keepnode
      AUTH_INTERNAL_TESTING: "true"
    command: node src/seed.ts
    volumes:
      - ./auth/src:/app/src:ro
    depends_on:
      db-security:
        condition: service_completed_successfully

  keepnode:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: keepfin_runtime
      DB_PASSWORD: keepfin-dev-runtime
      DB_NAME: keepnode
      DB_SSL_MODE: disable
      APP_ORIGIN: http://localhost:8080
      AUTH_SERVICE_URL: http://auth:3001
      TRUSTED_PROXY_CIDRS: 172.30.81.10/32
      API_IP_RATE_LIMIT: ${API_IP_RATE_LIMIT:-600}
      API_USER_RATE_LIMIT: ${API_USER_RATE_LIMIT:-300}
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-eodhd}
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set a random search API key}
    networks:
      default:
        ipv4_address: 172.30.81.11
    depends_on:
      db-security:
        condition: service_completed_successfully
      auth:
        condition: service_started
      typesense:
        condition: service_started
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app

  auth:
    build:
      context: ./auth
      target: development
    env_file: .env.auth.local
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://auth_runtime@postgres:5432/keepnode
      PGPASSWORD: auth-dev-runtime
      AUTH_TRUSTED_PROXY_CIDRS: 172.30.81.10/32,172.30.81.11/32
      AUTH_SESSION_RATE_LIMIT: ${AUTH_SESSION_RATE_LIMIT:-900}
      AUTH_MAIL_MODE: file
      AUTH_INTERNAL_TESTING: "true"
      AUTH_MAIL_DIRECTORY: /app/.mail
    volumes:
      - ./auth/src:/app/src:ro
      - ./.auth-mail:/app/.mail
    command: sh -c "npm run typecheck && npm run dev"
    depends_on:
      auth-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  vue:
    image: node:26-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTH_PROXY_TARGET: http://auth:3001
      API_PROXY_TARGET: http://keepnode:3000
    volumes:
      - ./web:/app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 8080"
    networks:
      default:
        ipv4_address: 172.30.81.10
    depends_on:
      - auth
      - keepnode
    restart: unless-stopped

  typesense:
    image: typesense/typesense:30.2
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set a random search API key}
    command: --data-dir /data
    volumes:
      - typesense_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keepnode
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keepnode"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.81.0/24

volumes:
  postgres_data:
  typesense_data:
